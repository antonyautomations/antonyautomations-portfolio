
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Voice Agent Systems - Antony Automations</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>
* {
    box-sizing: border-box;
}

body {
    background: #0b0b0c;
    color: #e6e6e6;
    font-family: "Times New Roman", serif;
    margin: 0;
    padding: 50px 25px;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1250px;
    margin: auto;
}

.back {
    display: inline-block;
    color: #d6c08d;
    text-decoration: none;
    margin-bottom: 35px;
    font-size: 17px;
}

h1 {
    text-align: center;
    color: #d6c08d;
    font-size: 2.5rem;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #999;
    font-size: 18px;
    margin-bottom: 55px;
}

.agent-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 30px;
}

.agent-card {
    background: #151517;
    border: 1px solid #29292b;
    border-radius: 18px;
    padding: 35px;
    min-height: 420px;
    transition: 0.3s ease;
}

.agent-card:hover {
    border-color: #d6c08d;
    transform: translateY(-5px);
    box-shadow: 0 10px 35px rgba(214,192,141,0.08);
}

.number {
    color: #b9a477;
    font-size: 15px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.agent-card h2 {
    color: #d6c08d;
    font-size: 27px;
    margin: 0 0 20px;
}

.image-placeholder {
    width: 100%;
    min-height: 190px;
    border: 1px dashed #62563c;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    background: #1b1b1d;
    text-align: center;
    margin-top: 20px;
}

.image-placeholder span {
    color: #b9a477;
    font-size: 15px;
}

@media (max-width: 700px) {
    body {
        padding: 30px 16px;
    }

    h1 {
        font-size: 2rem;
    }

    .agent-grid {
        grid-template-columns: 1fr;
    }

    .agent-card {
        padding: 25px;
        min-height: 350px;
    }
}
</style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">← Back to Portfolio</a>

    <h1>AI Voice Agent Systems</h1>

    <p class="subtitle">
        Intelligent Voice Automation Projects
    </p>

    <div class="agent-grid">

        <!-- ENGLISH VOICE AGENT -->

        <div class="agent-card">

            <div class="number">PROJECT 01</div>

            <h2>English Voice Agent</h2>

            <div class="image-placeholder">
                <span>English Voice Agent Images</span>
            </div>

        </div>


        <!-- MULTILINGUAL VOICE AGENT -->

        <div class="agent-card">

            <div class="number">PROJECT 02</div>

            <h2>Multilingual Voice Agent</h2>

            <div class="image-placeholder">
                <span>Multilingual Voice Agent Images</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
